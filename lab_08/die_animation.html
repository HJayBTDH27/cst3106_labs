<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-
scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        /* Styles for the dice container and individual dice */
        #diceContainer {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .die {
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid black;
            position: relative;
            transition: transform 0.3s;
        }

        .dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: black;
            position: absolute;
        }

        #rollDiceButton {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
    <title>ANIMATED DICE!!!</title>
</head>

<body>
    <h1>Look at 'em ROLL!</h1>

    <div id="diceContainer">
        <div id="die1" class="die" data-value="1">
            <div class="dot" style="top: 25%; left: 25%;"></div>
            <div class="dot" style="top: 25%; right: 25%;"></div>
            <div class="dot" style="top: 50%; left: 25%; transform: translate(0, -50%);"></div>
            <div class="dot" style="top: 50%; right: 25%; transform: translate(0, -50%);"></div>
            <div class="dot" style="bottom: 25%; left: 25%;"></div>
            <div class="dot" style="bottom: 25%; right: 25%;"></div>
        </div>
        <div id="die2" class="die" data-value="2">
            <div class="dot" style="top: 25%; left: 25%;"></div>
            <div class="dot" style="top: 25%; right: 25%;"></div>
            <div class="dot" style="top: 50%; left: 25%; transform: translate(0, -50%);"></div>
            <div class="dot" style="top: 50%; right: 25%; transform: translate(0, -50%);"></div>
            <div class="dot" style="bottom: 25%; left: 25%;"></div>
            <div class="dot" style="bottom: 25%; right: 25%;"></div>
        </div>
        <div id="die3" class="die" data-value="3">
            <div class="dot" style="top: 25%; left: 25%;"></div>
            <div class="dot" style="top: 25%; right: 25%;"></div>
            <div class="dot" style="top: 50%; left: 25%; transform: translate(0, -50%);"></div>
            <div class="dot" style="top: 50%; right: 25%; transform: translate(0, -50%);"></div>
            <div class="dot" style="bottom: 25%; left: 25%;"></div>
            <div class="dot" style="bottom: 25%; right: 25%;"></div>
        </div>
        <div id="die4" class="die" data-value="4">
            <div class="dot" style="top: 25%; left: 25%;"></div>
            <div class="dot" style="top: 25%; right: 25%;"></div>
            <div class="dot" style="top: 50%; left: 25%; transform: translate(0, -50%);"></div>
            <div class="dot" style="top: 50%; right: 25%; transform: translate(0, -50%);"></div>
            <div class="dot" style="bottom: 25%; left: 25%;"></div>
            <div class="dot" style="bottom: 25%; right: 25%;"></div>
        </div>
        <div id="die5" class="die" data-value="5">
            <div class="dot" style="top: 25%; left: 25%;"></div>
            <div class="dot" style="top: 25%; right: 25%;"></div>
            <div class="dot" style="top: 50%; left: 25%; transform: translate(0, -50%);"></div>
            <div class="dot" style="top: 50%; right: 25%; transform: translate(0, -50%);"></div>
            <div class="dot" style="bottom: 25%; left: 25%;"></div>
            <div class="dot" style="bottom: 25%; right: 25%;"></div>
        </div>
    </div>

    <button id="rollDiceButton">Click to Roll!</button>

    <p id="diceArray"></p>

    <script>
        $(document).ready(function () {
            $("#rollDiceButton").click(function () {
                let diceValues = [0, 0, 0, 0, 0];
                $(this).hide();
                diceValues = [...rollFiveDice()];
                $("#diceArray").text("Rolled Array: " + diceValues);
                $(this).show();
            });
        });

        function rollFiveDice() {
            let array = [0, 0, 0, 0, 0];
            $('.dot').remove();
            for (let i = 0; i < 5; i++) {
                array[i] = rollDie( (i+1) );
            }
            return array;
        }

        function rollDie( i ) {

            let x = Math.floor(Math.random() * 6) + 1;
            let degreeRotation = (Math.floor(Math.random() * 360) + 1) + "deg"; 

            $(`#die${i}`).css('transform', 'rotate(' + degreeRotation + ')');

            switch (x) {
                case 1:
                    $(`#die${i}`).append('<div class="dot" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>');
                    break;
                case 2:
                    $(`#die${i}`).append('<div class="dot" style="top: 25%; left: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="bottom: 25%; right: 25%;"></div>');
                    break;
                case 3:
                    $(`#die${i}`).append('<div class="dot" style="top: 25%; left: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>');
                    $(`#die${i}`).append('<div class="dot" style="bottom: 25%; right: 25%;"></div>');
                    break;
                case 4:
                    $(`#die${i}`).append('<div class="dot" style="top: 25%; left: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="top: 25%; right: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="bottom: 25%; left: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="bottom: 25%; right: 25%;"></div>');
                    break;
                case 5:
                    $(`#die${i}`).append('<div class="dot" style="top: 25%; left: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="top: 25%; right: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>');
                    $(`#die${i}`).append('<div class="dot" style="bottom: 25%; left: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="bottom: 25%; right: 25%;"></div>');
                    break;
                case 6:
                    $(`#die${i}`).append('<div class="dot" style="top: 25%; left: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="top: 25%; right: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="top: 50%; left: 25%; transform: translate(0, -50%);"></div>');
                    $(`#die${i}`).append('<div class="dot" style="top: 50%; right: 25%; transform: translate(0, -50%);"></div>');
                    $(`#die${i}`).append('<div class="dot" style="bottom: 25%; left: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="bottom: 25%; right: 25%;"></div>');
                    break;
            }
            return x;
        }
    </script>
</body>

</html>
