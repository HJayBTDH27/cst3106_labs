<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-
scale=1.0">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <style>
        /* Styles for the dice container and individual dice from provided example */
        #diceContainer {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .die {
            width: 150px;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid black;
            position: relative;
            transition: transform 0.3s;
        }

        .dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: black;
            position: absolute;
        }

        #rollDiceButton {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
    <title>ANIMATED DICE!!!</title>
</head>

<body>
    <h1>Look at 'em ROLL!</h1>
<!-- Code from provided example.
    Augmentations include: Adding four more die elements.
        giving unique ids to each element. -->
    <div id="diceContainer">
        <div id="die1" class="die" data-value="1">
            <div class="dot" style="top: 25%; left: 25%;"></div>
            <div class="dot" style="top: 25%; right: 25%;"></div>
            <div class="dot" style="top: 50%; left: 25%; transform: translate(0, -50%);"></div>
            <div class="dot" style="top: 50%; right: 25%; transform: translate(0, -50%);"></div>
            <div class="dot" style="bottom: 25%; left: 25%;"></div>
            <div class="dot" style="bottom: 25%; right: 25%;"></div>
        </div>
        <div id="die2" class="die" data-value="2">
            <div class="dot" style="top: 25%; left: 25%;"></div>
            <div class="dot" style="top: 25%; right: 25%;"></div>
            <div class="dot" style="top: 50%; left: 25%; transform: translate(0, -50%);"></div>
            <div class="dot" style="top: 50%; right: 25%; transform: translate(0, -50%);"></div>
            <div class="dot" style="bottom: 25%; left: 25%;"></div>
            <div class="dot" style="bottom: 25%; right: 25%;"></div>
        </div>
        <div id="die3" class="die" data-value="3">
            <div class="dot" style="top: 25%; left: 25%;"></div>
            <div class="dot" style="top: 25%; right: 25%;"></div>
            <div class="dot" style="top: 50%; left: 25%; transform: translate(0, -50%);"></div>
            <div class="dot" style="top: 50%; right: 25%; transform: translate(0, -50%);"></div>
            <div class="dot" style="bottom: 25%; left: 25%;"></div>
            <div class="dot" style="bottom: 25%; right: 25%;"></div>
        </div>
        <div id="die4" class="die" data-value="4">
            <div class="dot" style="top: 25%; left: 25%;"></div>
            <div class="dot" style="top: 25%; right: 25%;"></div>
            <div class="dot" style="top: 50%; left: 25%; transform: translate(0, -50%);"></div>
            <div class="dot" style="top: 50%; right: 25%; transform: translate(0, -50%);"></div>
            <div class="dot" style="bottom: 25%; left: 25%;"></div>
            <div class="dot" style="bottom: 25%; right: 25%;"></div>
        </div>
        <div id="die5" class="die" data-value="5">
            <div class="dot" style="top: 25%; left: 25%;"></div>
            <div class="dot" style="top: 25%; right: 25%;"></div>
            <div class="dot" style="top: 50%; left: 25%; transform: translate(0, -50%);"></div>
            <div class="dot" style="top: 50%; right: 25%; transform: translate(0, -50%);"></div>
            <div class="dot" style="bottom: 25%; left: 25%;"></div>
            <div class="dot" style="bottom: 25%; right: 25%;"></div>
        </div>
    </div>

    <button id="rollDiceButton">Click to Roll!</button>
    <!-- The <p> element where I will print the diceValues array. -->
    <p id="diceArray"></p>

    <script>
        /* Code from provided example.
        Augmentations include: diceValues array to contain each generated value.
            nesting the roll function into the array assignment.
            printing the values array to the html. */ 
        $(document).ready(function () {
            $("#rollDiceButton").click(function () {
                let diceValues = [0, 0, 0, 0, 0];
                $(this).hide();
                diceValues = [...rollFiveDice()];
                $("#diceArray").text("Rolled Array: " + diceValues);
                $(this).show();
            });
        });
        /* Function from my Yatzy program. Augmented to remove all dots when invoked.
            Dot removal was moved to first function to prevent removing all dots
            during second function and ending up with one remaining die. */
        function rollFiveDice() {
            let array = [0, 0, 0, 0, 0];
            $('.dot').remove();
            for (let i = 0; i < 5; i++) {
                array[i] = rollDie( (i+1) );
            }
            return array;
        }
        /* Code from provided example. 
        Augmentations include a parameter for the function,
            and coding that parameter to specify the appropriate die element.*/
        function rollDie( i ) {

            let x = Math.floor(Math.random() * 6) + 1;
            let degreeRotation = (Math.floor(Math.random() * 360) + 1) + "deg"; 

            $(`#die${i}`).css('transform', 'rotate(' + degreeRotation + ')');

            /* Switch code from provided example. Adjusted for my language and functionality */
            switch (x) {
                case 1:
                    $(`#die${i}`).append('<div class="dot" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>');
                    break;
                case 2:
                    $(`#die${i}`).append('<div class="dot" style="top: 25%; left: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="bottom: 25%; right: 25%;"></div>');
                    break;
                case 3:
                    $(`#die${i}`).append('<div class="dot" style="top: 25%; left: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>');
                    $(`#die${i}`).append('<div class="dot" style="bottom: 25%; right: 25%;"></div>');
                    break;
                case 4:
                    $(`#die${i}`).append('<div class="dot" style="top: 25%; left: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="top: 25%; right: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="bottom: 25%; left: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="bottom: 25%; right: 25%;"></div>');
                    break;
                case 5:
                    $(`#die${i}`).append('<div class="dot" style="top: 25%; left: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="top: 25%; right: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="top: 50%; left: 50%; transform: translate(-50%, -50%);"></div>');
                    $(`#die${i}`).append('<div class="dot" style="bottom: 25%; left: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="bottom: 25%; right: 25%;"></div>');
                    break;
                case 6:
                    $(`#die${i}`).append('<div class="dot" style="top: 25%; left: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="top: 25%; right: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="top: 50%; left: 25%; transform: translate(0, -50%);"></div>');
                    $(`#die${i}`).append('<div class="dot" style="top: 50%; right: 25%; transform: translate(0, -50%);"></div>');
                    $(`#die${i}`).append('<div class="dot" style="bottom: 25%; left: 25%;"></div>');
                    $(`#die${i}`).append('<div class="dot" style="bottom: 25%; right: 25%;"></div>');
                    break;
            }
            // Return the random die value to fill the dice array
            return x;
        }
    </script>
</body>

</html>
